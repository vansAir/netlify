<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>回归海斗倒计时</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        'hex-dark': '#0a0e1a', 'hex-blue': '#00d4ff', 'hex-mid': '#0080ff', 'hex-glow': '#4488ff'
      }}}
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#060810;min-height:100vh;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;color:#c0d8ff;overflow-x:hidden}
    #particle-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
    #fire-canvas{position:absolute;left:0;right:0;top:0;z-index:2;pointer-events:none}
    #app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 12px 40px}
    .page-card{width:100%;max-width:430px}
    .hero-section{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 0 30px}
    .hero-title{
      font-family:'Orbitron','Noto Sans SC',sans-serif;
      font-size:2.8rem;
      font-weight:900;
      letter-spacing:.1em;
      text-align:center;
      line-height:1.2;
      background:linear-gradient(180deg,#ffffff 0%,#ffe066 25%,#ff8800 55%,#ff4400 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      filter:drop-shadow(0 0 14px #ff660088) drop-shadow(0 0 40px #ff440055);
      position:relative;z-index:3;
      animation:firePulse 2s ease-in-out infinite;
    }
    @keyframes firePulse{
      0%,100%{filter:drop-shadow(0 0 14px #ff660088) drop-shadow(0 0 40px #ff440055)}
      50%{filter:drop-shadow(0 0 22px #ff880099) drop-shadow(0 0 56px #ff440077)}
    }
    .hero-subtitle{
      font-size:1.4rem;font-weight:700;letter-spacing:.3em;text-align:center;
      color:#ffaa44;
      text-shadow:0 0 10px #ff660088,0 0 24px #ff440044;
      margin-top:8px;position:relative;z-index:3;
    }
    .user-card{
      background:rgba(0,40,100,.35);backdrop-filter:blur(8px);
      border:1px solid #0080ff44;border-radius:14px;
      padding:18px 20px;position:relative;
      transition:box-shadow .3s,border-color .3s;
      box-shadow:0 0 8px #0080ff18;
    }
    .user-card:hover{box-shadow:0 0 18px #00d4ff44,0 0 36px #0080ff22;border-color:#0080ff88}
    .user-name{color:#fff;font-size:1.25rem;font-weight:700;letter-spacing:.05em}
    .countdown-text{
      font-family:'Orbitron',monospace;color:#00d4ff;font-size:1.15rem;font-weight:700;
      text-shadow:0 0 8px #00d4ffaa,0 0 20px #0080ff44;letter-spacing:.08em;
    }
    .countdown-expired{
      font-family:'Orbitron',monospace;color:#ff4466;font-size:1.05rem;font-weight:700;
      text-shadow:0 0 10px #ff446699,0 0 24px #ff446644;
    }
    .cd-block{display:inline-flex;flex-direction:column;align-items:center;margin:0 5px}
    .cd-num{font-size:2rem;line-height:1}
    .cd-label{font-size:.55rem;color:#4488ffaa;letter-spacing:.1em;margin-top:3px}
    .expire-time{color:#4488ff55;font-size:.72rem;letter-spacing:.03em}
    .empty-state{color:#4488ff44;font-size:.9rem;letter-spacing:.15em;text-align:center;padding:40px 0}
    .footer-note{color:#4488ff33;font-size:.65rem;letter-spacing:.05em;text-align:center}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-track{background:#060810}
    ::-webkit-scrollbar-thumb{background:#0080ff44;border-radius:2px}
  </style>
</head>
<body>
  <canvas id="particle-canvas"></canvas>
  <div id="app">
    <div class="page-card">
      <section class="hero-section">
        <canvas id="fire-canvas"></canvas>
        <h1 class="hero-title">回归海斗</h1>
        <p class="hero-subtitle">倒 计 时</p>
      </section>
      <section>
        <div v-if="users.length===0" class="empty-state">- 暂无玩家 -</div>
        <div v-for="user in users" :key="user.name" class="user-card mb-4">
          <div class="user-name mb-3">{{ user.name }}</div>
          <div v-if="getRemaining(user.expire_ts)===null" class="countdown-expired">已到期</div>
          <div v-else class="countdown-text flex items-end flex-wrap gap-1">
            <span class="cd-block"><span class="cd-num">{{ getRemaining(user.expire_ts).days }}</span><span class="cd-label">天</span></span>
            <span class="cd-block"><span class="cd-num">{{ getRemaining(user.expire_ts).hours }}</span><span class="cd-label">时</span></span>
            <span class="cd-block"><span class="cd-num">{{ getRemaining(user.expire_ts).minutes }}</span><span class="cd-label">分</span></span>
            <span class="cd-block"><span class="cd-num">{{ getRemaining(user.expire_ts).seconds }}</span><span class="cd-label">秒</span></span>
          </div>
          <div class="expire-time mt-2">到期：{{ formatTs(user.expire_ts) }}</div>
        </div>
      </section>
      <footer class="mt-6"><p class="footer-note">每秒刷新 · 每30s同步服务器</p></footer>
    </div>
  </div>

  <script>
    const { createApp, ref, onMounted, onUnmounted } = Vue;
    const API_BASE = 'https://monopoly.z-zzz.site';
    createApp({
      setup() {
        const users = ref([]);
        const nowTs = ref(Math.floor(Date.now() / 1000));
        async function fetchUsers() {
          try {
            const res = await fetch(API_BASE + '/api/users');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            users.value = await res.json();
          } catch (e) { console.error('[fetchUsers]', e); }
        }
        function getRemaining(expireTs) {
          const diff = expireTs - nowTs.value;
          if (diff <= 0) return null;
          return {
            days: String(Math.floor(diff / 86400)).padStart(2, '0'),
            hours: String(Math.floor((diff % 86400) / 3600)).padStart(2, '0'),
            minutes: String(Math.floor((diff % 3600) / 60)).padStart(2, '0'),
            seconds: String(diff % 60).padStart(2, '0'),
          };
        }
        function formatTs(ts) {
          const d = new Date(ts * 1000), p = n => String(n).padStart(2, '0');
          return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
        }
        let tickTimer, syncTimer;
        onMounted(() => {
          fetchUsers();
          tickTimer = setInterval(() => { nowTs.value = Math.floor(Date.now() / 1000); }, 1000);
          syncTimer = setInterval(fetchUsers, 30000);
        });
        onUnmounted(() => { clearInterval(tickTimer); clearInterval(syncTimer); });
        return { users, getRemaining, formatTs };
      },
    }).mount('#app');
  </script>

  <!-- 轻量粒子（无连线，40个） -->
  <script>
  (function(){
    var c=document.getElementById('particle-canvas'),x=c.getContext('2d');
    var C=['#00d4ff','#0080ff','#ffffff','#4488ff','#66bbff'];
    var W=0,H=0,ps=[];
    function rf(a,b){return Math.random()*(b-a)+a}
    function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
    function mk(){return{x:rf(0,W),y:rf(0,H),vx:rf(-.3,.3),vy:rf(-.3,.3),r:rf(1,2),c:C[ri(0,C.length-1)],a:rf(.3,.9),f:0}}
    function rs(){W=innerWidth;H=innerHeight;c.width=W;c.height=H;ps=[];for(var i=0;i<40;i++)ps.push(mk())}
    function lp(){
      x.clearRect(0,0,W,H);
      for(var i=0;i<ps.length;i++){
        var p=ps[i];
        p.x+=p.vx;p.y+=p.vy;
        if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;
        if(p.y<-5)p.y=H+5;if(p.y>H+5)p.y=-5;
        if(p.f<=0&&Math.random()<.005)p.f=6;
        if(p.f>0)p.f--;
        x.beginPath();
        x.arc(p.x,p.y,p.r+(p.f>0?1.5:0),0,Math.PI*2);
        x.fillStyle=p.f>0?'#fff':p.c;
        x.globalAlpha=p.f>0?1:p.a;
        x.shadowColor=p.c;x.shadowBlur=p.f>0?20:6;
        x.fill();x.shadowBlur=0;x.globalAlpha=1;
      }
      requestAnimationFrame(lp);
    }
    addEventListener('resize',rs);rs();lp();
  })();
  </script>

  <!-- 火焰燃烧特效 -->
  <script>
  (function(){
    var c=document.getElementById('fire-canvas');
    if(!c)return;
    var x=c.getContext('2d'),fs=[];
    var MX=55;
    function rf(a,b){return Math.random()*(b-a)+a}
    function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
    function rs(){
      var s=c.parentElement;
      c.width=s.offsetWidth;
      c.height=s.offsetHeight;
    }
    function sp(){
      fs.push({
        x:rf(c.width*.05,c.width*.95),
        y:c.height*.65,
        vx:rf(-.8,.8),
        vy:rf(-3,-1.2),
        r:rf(3,12),
        life:1,
        decay:rf(.01,.025),
        hue:ri(5,50)
      });
    }
    function lp(){
      x.clearRect(0,0,c.width,c.height);
      while(fs.length<MX)sp();
      for(var i=fs.length-1;i>=0;i--){
        var f=fs[i];
        f.x+=f.vx+rf(-.4,.4);
        f.y+=f.vy;
        f.vy*=.99;
        f.r*=.993;
        f.life-=f.decay;
        if(f.life<=0||f.r<.5){fs.splice(i,1);continue}
        x.beginPath();
        x.arc(f.x,f.y,f.r,0,Math.PI*2);
        var a=f.life*.75;
        x.fillStyle='hsla('+f.hue+',100%,'+(50+f.life*30)+'%,'+a+')';
        x.shadowColor='hsla('+f.hue+',100%,60%,'+(a*.5)+')';
        x.shadowBlur=18;
        x.fill();
        x.shadowBlur=0;
      }
      requestAnimationFrame(lp);
    }
    addEventListener('resize',rs);rs();lp();
  })();
  </script>
</body>
</html>
